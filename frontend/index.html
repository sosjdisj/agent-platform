<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent Platform：基于 LangGraph 的智能体任务编排平台" />
    <!-- 内联 SVG favicon，避免额外请求与 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%231677ff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Agent Platform</title>
    <style>
      /* Vue 挂载前的首屏骨架：与主题色一致，挂载后被 #app 内容替换 */
      #app:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
      }
      #app:empty::before {
        content: '';
        position: fixed;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border: 3px solid #c6e0ff;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
        z-index: 1;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
