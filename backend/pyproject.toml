[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-backend"
version = "0.1.0"
description = "Agent 平台后端（FastAPI + PostgreSQL + Redis + Qdrant）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9.0",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    "fastmcp>=4.0.0",
    "sentence-transformers>=5.0.0",  # 本地 Embedding（魔搭模型，延迟加载 torch）
    "modelscope>=1.20.0",  # 魔搭社区模型下载
    "langchain-text-splitters>=1.0.0",  # Markdown 标题感知分块（与 LangChain 生态一致）
    "openai>=1.60.0",  # OpenAI 兼容 LLM Client（统一封装见 app/core/llm.py）
    "langgraph>=0.4.0",  # Agent 编排图（app/agents/graph.py）
    "langgraph-checkpoint-postgres>=2.0.0",  # LangGraph 状态持久化（app/agents/checkpoint.py）
    "psycopg[binary]>=3.2.0",  # checkpointer 的 psycopg3 驱动（Windows 需 binary 版）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fakeredis>=2.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*", "tests*"]
